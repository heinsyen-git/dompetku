<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dompet Rapi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0EE;--surface:#FFFFFF;--sunk:#F3F7F6;--ink:#14302C;--muted:#5A6F6B;--line:#D3DEDB;
  --brand:#0E6A5A;--brand-ink:#FFFFFF;--warn:#B5700A;--warn-bg:#FCF1DC;--bad:#BF3A2D;--bad-bg:#FBE6E3;--good:#2D7A48;--good-bg:#E2F2E7;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1817;--surface:#162322;--sunk:#1B2B29;--ink:#E3EDEB;--muted:#93A6A2;--line:#283A38;
  --brand:#3DB39B;--brand-ink:#08201B;--warn:#E6A63A;--warn-bg:#3A2D14;--bad:#F06C5F;--bad-bg:#3D1F1C;--good:#5EC383;--good-bg:#183324;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1817;--surface:#162322;--sunk:#1B2B29;--ink:#E3EDEB;--muted:#93A6A2;--line:#283A38;
  --brand:#3DB39B;--brand-ink:#08201B;--warn:#E6A63A;--warn-bg:#3A2D14;--bad:#F06C5F;--bad-bg:#3D1F1C;--good:#5EC383;--good-bg:#183324;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:4px 2px 14px}
.hbtns{display:flex;gap:6px;align-items:center}
.menuwrap{position:relative}
#moreBtn{font-size:18px;line-height:1;padding:5px 12px}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;min-width:190px;z-index:15}
.menu button{all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600}
.menu button:hover{background:var(--sunk)}
.menu button.danger{color:var(--bad)}
header.top h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0}
.sync{font-size:12px;color:var(--muted);display:block}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:16px}
.tabs button{all:unset;cursor:pointer;text-align:center;padding:10px 8px;border-radius:10px;font-weight:600;color:var(--muted);position:relative}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.tabs .dot{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;margin-left:6px;padding:0 5px;vertical-align:1px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* hero ledger */
.hero{background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:18px 18px 16px;margin-bottom:14px}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:2px 0 12px}
.gauge{height:12px;border-radius:6px;background:rgba(255,255,255,.22);overflow:hidden}
:root[data-theme="dark"] .gauge{background:rgba(0,0,0,.22)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gauge{background:rgba(0,0,0,.22)}}
.gauge i{display:block;height:100%;background:currentColor;border-radius:6px;transition:width .4s ease}
.gauge.over i{background:#FFD1CB}
.hero .row{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;gap:12px}
.hero .row b{font-weight:700}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.split .box{border-radius:16px;padding:14px;background:var(--surface);border:1px solid var(--line)}
.split .box .lbl{font-size:12.5px;color:var(--muted)}
.split .box .v{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.split .box.owe .v{color:var(--bad)}
.split .box.lend .v{color:var(--good)}

.alert{border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px;background:var(--bad-bg);color:var(--bad);font-weight:600}
.alert.warn{background:var(--warn-bg);color:var(--warn)}

h2{font-size:15px;font-weight:700;margin:20px 2px 8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;gap:12px;padding:13px 14px;border-top:1px solid var(--line);align-items:flex-start}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.item .amt{text-align:right;font-weight:700;white-space:nowrap}
.item .amt small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;margin-top:4px}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-bg);color:var(--good)}
.dir{width:10px;height:10px;border-radius:5px;margin-top:6px;flex:none}
.dir.out{background:var(--bad)}.dir.in{background:var(--good)}
.prog{height:4px;border-radius:2px;background:var(--sunk);margin-top:7px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.acts button,.ghost{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:8px;border:1px solid var(--line);color:var(--ink)}
.acts button.del{color:var(--bad)}
.empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:14px}
.done-item{opacity:.62}

.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.monthnav button{all:unset;cursor:pointer;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px;border:1px solid var(--line);background:var(--surface)}
.monthnav b{font-size:16px}
.cats{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.cat{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 0;font-size:13.5px}
.cat .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.cat .bar i{display:block;height:100%}
.dayhead{font-size:12.5px;color:var(--muted);font-weight:600;padding:9px 14px 4px;background:var(--sunk);display:flex;justify-content:space-between;border-top:1px solid var(--line)}
.dayhead:first-child{border-top:0}
.cdot{display:inline-block;width:9px;height:9px;border-radius:5px;margin-right:6px;vertical-align:0}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));border:0;cursor:pointer;background:var(--brand);color:var(--brand-ink);font:700 15px "Plus Jakarta Sans",system-ui,sans-serif;padding:14px 26px;border-radius:999px;box-shadow:0 6px 20px rgba(14,106,90,.35)}

.scrim{position:fixed;inset:0;background:rgba(5,20,18,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.scrim.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.gauge i{transition:none}}
.sheet h3{margin:0 0 14px;font-size:18px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.field input.money{font-size:22px;font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"].out{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.seg button[aria-pressed="true"].in{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{all:unset;cursor:pointer;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btns{display:flex;gap:8px;margin-top:16px}
.btns button{flex:1;border:0;cursor:pointer;font:700 15px "Plus Jakarta Sans",system-ui,sans-serif;padding:13px;border-radius:12px}
.primary{background:var(--brand);color:var(--brand-ink)}
.secondary{background:var(--sunk);color:var(--ink);border:1px solid var(--line)!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%}
.toast.show{opacity:1}
.loginbox{text-align:center;padding:18vh 12px 0}.loginbox .logo{font-size:52px}.loginbox h1{font-size:26px;font-weight:800;margin:6px 0}.loginbox p{color:var(--muted);margin:0 0 22px}.loginbox button{border:0;cursor:pointer;font:700 16px "Plus Jakarta Sans",system-ui,sans-serif;padding:14px 26px;border-radius:12px}
[hidden]{display:none!important}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:5px;background:var(--warn-bg);color:var(--warn);vertical-align:1px}
.chips button[aria-pressed="true"] .tag{background:transparent;color:inherit;border:1px solid currentColor}
a.calbtn{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:8px;border:1px solid var(--line);color:var(--brand)}
.sec{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 2px 10px}
.inputcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.inputcard h3{margin:0 0 14px;font-size:18px}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<div class="wrap" id="login">
  <div class="loginbox"><div class="logo">💰</div><h1>Dompet Rapi</h1><p>Catat hutang dan pengeluaran, tersinkron di semua perangkat Anda.</p><button class="primary" id="loginBtn">Masuk dengan Google</button></div>
</div>
<div class="wrap" id="app" hidden>
  <header class="top"><div><h1>Dompet Rapi</h1><span class="sync" id="sync"></span></div><div class="hbtns"><button class="ghost" id="exportBtn">Ekspor ke Excel</button>
    <div class="menuwrap"><button class="ghost" id="moreBtn" aria-haspopup="true" aria-expanded="false" aria-label="Menu lainnya">⋮</button>
      <div class="menu" id="moreMenu" hidden>
        <button id="budgetBtn">💵 Atur anggaran bulanan</button>
        <button id="notifBtn">🔔 Aktifkan notifikasi</button>
        <button id="backupBtn">Backup data (JSON)</button>
        <button id="importBtn">Impor backup</button>
        <button id="logoutBtn" class="danger">Keluar</button>
      </div></div>
    <input type="file" id="importFile" accept=".json,application/json" hidden></div></header>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-debt" aria-selected="true">Dashboard<span class="dot" id="dueBadge" hidden></span></button>
    <button role="tab" id="tab-exp" aria-selected="false">+ Input Pengeluaran</button>
  </div>
  <section id="view-debt"><div id="dash-debt"></div><div id="dash-exp"></div></section>
  <section id="view-exp" hidden></section>
</div>
<button class="fab" id="fab" hidden>+ Catat hutang</button>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager, doc, getDoc, setDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const CATS=[
  {id:'makan',n:'Makan & minum',c:'#E07A3F'},{id:'transport',n:'Transportasi',c:'#3B7DD8'},
  {id:'belanja',n:'Belanja',c:'#B256C4'},{id:'tagihan',n:'Tagihan & cicilan',c:'#C9453B'},
  {id:'pulsa',n:'Pulsa & internet',c:'#2AA198'},{id:'hiburan',n:'Hiburan',c:'#D4A017'},
  {id:'kesehatan',n:'Kesehatan',c:'#4C9F5A'},{id:'keluarga',n:'Keluarga & sosial',c:'#8A6D5A'},
  {id:'lain',n:'Lainnya',c:'#7D8B89'}];
const METHODS=[
  {id:'tunai',n:'Tunai',k:'cash'},{id:'debit',n:'Debit / Transfer',k:'cash'},{id:'qris',n:'QRIS',k:'cash'},
  {id:'gopay',n:'GoPay',k:'ewallet'},{id:'ovo',n:'OVO',k:'ewallet'},{id:'dana',n:'DANA',k:'ewallet'},{id:'shopeepay',n:'ShopeePay',k:'ewallet'},
  {id:'kk',n:'Kartu kredit',k:'credit'},{id:'spaylater',n:'SPayLater',k:'credit'},{id:'gopaylater',n:'GoPayLater',k:'credit'},
  {id:'kredivo',n:'Kredivo',k:'credit'},{id:'akulaku',n:'Akulaku',k:'credit'},{id:'lain',n:'Lainnya',k:'cash'}];
const methodOf=id=>METHODS.find(m=>m.id===id);
const methodLabel=x=>!x.method?'Tidak dicatat':(x.method==='lain'&&x.methodName?x.methodName:(methodOf(x.method)||{n:x.method}).n);
const isCredit=x=>!!(methodOf(x.method)&&methodOf(x.method).k==='credit')||!!x.methodCredit;
const catOf=id=>CATS.find(c=>c.id===id)||CATS[CATS.length-1];
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

let uid=null;
let state={debts:[],budget:0,months:{}};
let tab='debt', curMonth=monthKey(new Date());
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const uidGen=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function niceDate(s){const d=parseD(s);return d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear()}
function daysUntil(s){const t=parseD(todayStr());return Math.round((parseD(s)-t)/86400000)}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}

/* ---------- firebase ---------- */
// GANTI dengan firebaseConfig dari Firebase Console (Project settings > Your apps) bila ada yang berbeda
const firebaseConfig = {
  apiKey: "AIzaSyAYe37xHMzjddRkLFuEDH1CUus3p7an4Do",
  authDomain: "apps-dompet.firebaseapp.com",
  projectId: "apps-dompet",
  storageBucket: "apps-dompet.firebasestorage.app",
  messagingSenderId: "568495803705",
  appId: "1:568495803705:web:116f3fb5fdcd99297d6ce8",
  measurementId: "G-YVWCF29S91"
};
const fbApp=initializeApp(firebaseConfig);
let fs;
try{fs=initializeFirestore(fbApp,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){fs=getFirestore(fbApp)}
const auth=getAuth(fbApp);

/* ---------- storage ---------- */
const ref=k=>doc(fs,'users',uid,'dompet',k);
async function loadKey(k){
  try{const s=await getDoc(ref(k));return s.exists()?s.data():null}catch(e){console.error(e);return null}
}
async function saveKey(k,v){
  try{await setDoc(ref(k),v)}catch(e){console.error(e);toast('Gagal menyimpan: '+(e.code||'cek koneksi'))}
}
async function loadAll(){
  const d=await loadKey('debts'); state.debts=(d&&d.items)||[];
  const s=await loadKey('settings'); state.budget=(s&&s.budget)||0; state.lastMethod=(s&&s.lastMethod)||'tunai';
  state.months={}; await ensureMonth(curMonth);
}
async function ensureMonth(m){
  if(state.months[m]) return;
  const e=await loadKey('exp-'+m); state.months[m]=(e&&e.items)||[];
}
const saveDebts=()=>saveKey('debts',{items:state.debts,updatedAt:Date.now()});
const saveSettings=()=>saveKey('settings',{budget:state.budget,lastMethod:state.lastMethod||'tunai',updatedAt:Date.now()});
const saveMonth=m=>saveKey('exp-'+m,{items:state.months[m]||[],updatedAt:Date.now()});
function saveFile(name,blob){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ---------- debts ---------- */
function debtStatus(x){
  if(x.done) return {cls:'good',txt:'Lunas',rank:9};
  if(!x.due) return {cls:'ok',txt:'Tanpa jatuh tempo',rank:5};
  const n=daysUntil(x.due);
  if(n<0) return {cls:'bad',txt:'Telat '+(-n)+' hari',rank:0};
  if(n===0) return {cls:'bad',txt:'Jatuh tempo hari ini',rank:1};
  if(n<=3) return {cls:'warn',txt:n+' hari lagi',rank:2};
  return {cls:'ok',txt:'Tempo '+niceDate(x.due),rank:3};
}
function renderDebts(){
  const open=state.debts.filter(x=>!x.done);
  const owe=open.filter(x=>x.dir==='out').reduce((a,x)=>a+(x.amount-(x.paid||0)),0);
  const lend=open.filter(x=>x.dir==='in').reduce((a,x)=>a+(x.amount-(x.paid||0)),0);
  const urgent=open.filter(x=>x.due&&daysUntil(x.due)<=0);
  const soon=open.filter(x=>x.due&&daysUntil(x.due)>0&&daysUntil(x.due)<=3);
  const badge=$('dueBadge'); const nAlert=urgent.length+soon.length;
  badge.hidden=!nAlert; badge.textContent=nAlert;

  let h=`<div class="sec">Hutang & Piutang</div><div class="split">
    <div class="box owe"><div class="lbl">Hutang saya</div><div class="v num">${rp(owe)}</div></div>
    <div class="box lend"><div class="lbl">Piutang (orang ke saya)</div><div class="v num">${rp(lend)}</div></div></div>`;
  if(urgent.length) h+=`<div class="alert">${urgent.length} catatan sudah/hari ini jatuh tempo, total ${rp(urgent.reduce((a,x)=>a+x.amount-(x.paid||0),0))}</div>`;
  else if(soon.length) h+=`<div class="alert warn">${soon.length} catatan jatuh tempo dalam 3 hari</div>`;

  const sorted=open.slice().sort((a,b)=>{const ra=debtStatus(a).rank,rb=debtStatus(b).rank;if(ra!==rb)return ra-rb;return (a.due||'9').localeCompare(b.due||'9')});
  h+=`<h2>Belum lunas</h2><div class="list">`;
  h+= sorted.length? sorted.map(itemHTML).join('') : `<div class="empty">Belum ada catatan hutang. Ketuk “+ Catat hutang” untuk menambah.</div>`;
  h+=`</div>`;
  const done=state.debts.filter(x=>x.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  if(done.length) h+=`<h2>Sudah lunas</h2><div class="list">${done.slice(0,20).map(itemHTML).join('')}</div>`;
  $('dash-debt').innerHTML=h;
}
function calUrl(x){
  const d=x.due.replace(/-/g,'');const left=x.amount-(x.paid||0);
  const t=(x.dir==='out'?'Bayar hutang ke ':'Tagih piutang dari ')+x.name+' '+rp(left);
  const det='Jatuh tempo '+niceDate(x.due)+(x.note?'\n'+x.note:'')+'\n\nDicatat di Dompet Rapi: '+location.href;

$('view-debt').addEventListener('click',e=>{

/* ---------- expenses ---------- */
function renderExp(){
  const items=state.months[curMonth]||[];
  const total=items.reduce((a,x)=>a+x.amount,0);
  const [y,m]=curMonth.split('-').map(Number);
  const isNow=curMonth===monthKey(new Date());
  const dim=new Date(y,m,0).getDate();
  const dayN=isNow?new Date().getDate():dim;
  const avg=total/Math.max(1,dayN);
  const proj=isNow?avg*dim:total;
  let h=`<div class="sec" style="margin-top:30px">Pengeluaran</div><div class="monthnav"><button id="prevM" aria-label="Bulan sebelumnya">‹</button><b>${BULAN[m-1]} ${y}</b><button id="nextM" aria-label="Bulan berikutnya">›</button></div>`;
  if(state.budget>0){
    const left=state.budget-total; const pct=Math.min(100,total/state.budget*100);
    const daysLeft=isNow?dim-dayN+1:0;
    h+=`<div class="hero"><div class="lbl">${left>=0?'Sisa anggaran bulan ini':'Melebihi anggaran'}</div>
      <div class="big num">${rp(Math.abs(left))}</div>
      <div class="gauge ${left<0?'over':''}"><i style="width:${pct}%"></i></div>
      <div class="row"><span>Terpakai <b class="num">${rp(total)}</b></span><span>Anggaran <b class="num">${rp(state.budget)}</b></span></div>
      ${isNow&&left>0?`<div class="row"><span>Aman dipakai per hari sampai akhir bulan</span><b class="num">${rp(left/daysLeft)}</b></div>`:''}
      ${isNow&&proj>state.budget&&left>=0?`<div class="row"><span>Dengan pola sekarang, akhir bulan bisa tembus</span><b class="num">${rp(proj)}</b></div>`:''}
      </div>`;
  } else {
    h+=`<div class="hero"><div class="lbl">Total pengeluaran</div><div class="big num">${rp(total)}</div>
      <div class="row"><span>Belum ada anggaran bulanan</span></div></div>`;
  }

  if(items.length){
    const credit=items.filter(isCredit).reduce((a,x)=>a+x.amount,0);
    if(credit) h+=`<div class="alert warn" style="margin-top:14px">Dipakai lewat kredit & paylater bulan ini: <b class="num">${rp(credit)}</b>. Jumlah ini akan jadi tagihan yang harus dibayar.</div>`;
    const bm={}; items.forEach(x=>{const l=methodLabel(x);bm[l]=bm[l]||{v:0,c:isCredit(x)};bm[l].v+=x.amount});
    const mrows=Object.entries(bm).sort((a,b)=>b[1].v-a[1].v);
    h+=`<h2>Per metode bayar</h2><div class="cats">${mrows.map(([l,o])=>`<div class="cat"><span>${esc(l)}${o.c?' <span class="tag">kredit</span>':''}</span><span class="num">${rp(o.v)} <span style="color:var(--muted)">(${Math.round(o.v/total*100)}%)</span></span><div class="bar"><i style="width:${o.v/mrows[0][1].v*100}%;background:${o.c?'var(--warn)':'var(--brand)'}"></i></div></div>`).join('')}</div>`;
    const by={}; items.forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amount);
    const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
    h+=`<h2>Per kategori</h2><div class="cats">${rows.map(([c,v])=>{const k=catOf(c);return `<div class="cat"><span><span class="cdot" style="background:${k.c}"></span>${k.n}</span><span class="num">${rp(v)} <span style="color:var(--muted)">(${Math.round(v/total*100)}%)</span></span><div class="bar"><i style="width:${v/rows[0][1]*100}%;background:${k.c}"></i></div></div>`}).join('')}</div>`;
    const days={}; items.forEach(x=>(days[x.date]=days[x.date]||[]).push(x));
    h+=`<h2>Riwayat</h2><div class="list">`;
    Object.keys(days).sort().reverse().forEach(d=>{
      const arr=days[d]; h+=`<div class="dayhead"><span>${niceDate(d)}</span><span class="num">${rp(arr.reduce((a,x)=>a+x.amount,0))}</span></div>`;
      arr.slice().reverse().forEach(x=>{const k=catOf(x.cat);h+=`<div class="item"><span class="dir" style="background:${k.c}"></span><div class="main"><div class="t">${esc(x.note||k.n)}</div><div class="s">${k.n}, via ${esc(methodLabel(x))}${isCredit(x)?' <span class="tag">kredit</span>':''}</div><div class="acts"><button data-e="edit" data-id="${x.id}">Ubah</button><button class="del" data-e="del" data-id="${x.id}">Hapus</button></div></div><div class="amt num">${rp(x.amount)}</div></div>`});
    });
    h+=`</div>`;
  } else h+=`<h2>Riwayat</h2><div class="list"><div class="empty">Belum ada pengeluaran di bulan ini. Ketuk “+ Catat pengeluaran”.</div></div>`;
  $('dash-exp').innerHTML=h;
  $('prevM').onclick=()=>shiftMonth(-1); $('nextM').onclick=()=>shiftMonth(1);
}
async function shiftMonth(n){const [y,m]=curMonth.split('-').map(Number);curMonth=monthKey(new Date(y,m-1+n,1));await ensureMonth(curMonth);render()}
$('view-debt').addEventListener('click',e=>{
  const b=e.target.closest('button[data-e]'); if(!b) return;
  const arr=state.months[curMonth]; const x=arr.find(i=>i.id===b.dataset.id); if(!x) return;
  if(b.dataset.e==='del'){if(confirm('Hapus pengeluaran ini?')){state.months[curMonth]=arr.filter(i=>i!==x);saveMonth(curMonth);render();toast('Pengeluaran dihapus')}}
  else openExpSheet(x);
});

function openSheet(html){$('sheet').innerHTML=html;$('scrim').classList.add('open');const f=$('sheet').querySelector('input');if(f)setTimeout(()=>f.focus(),60);const c=$('sheet').querySelector('[data-close]');if(c)c.onclick=closeSheet}

async function exportXlsx(){
  if(!window.XLSX){toast('Fitur ekspor gagal dimuat, coba buka ulang');return}
  const [y,m]=curMonth.split('-').map(Number);
  const items=(state.months[curMonth]||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const total=items.reduce((a,x)=>a+x.amount,0);
  const wb=XLSX.utils.book_new();
  const now=new Date();
  const stamp='Diperbarui: '+now.getDate()+' '+BULAN[now.getMonth()]+' '+now.getFullYear()+', pukul '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const ex=[[stamp],[],['Tanggal','Kategori','Keterangan','Metode bayar','Kredit/Paylater','Jumlah (Rp)']].concat(items.map(x=>[x.date,catOf(x.cat).n,x.note||'',methodLabel(x),isCredit(x)?'Ya':'',x.amount]));
  ex.push([],['','','','','Total',total]);const cr=items.filter(isCredit).reduce((a,x)=>a+x.amount,0);if(cr)ex.push(['','','','','Total via kredit/paylater',cr]);
  if(state.budget>0) ex.push(['','','','','Anggaran',state.budget],['','','','','Sisa',state.budget-total]);
  const ws1=XLSX.utils.aoa_to_sheet(ex); ws1['!cols']=[{wch:12},{wch:20},{wch:30},{wch:18},{wch:24},{wch:16}];
  XLSX.utils.book_append_sheet(wb,ws1,'Pengeluaran');
  const by={}; items.forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amount);
  const cat=[[stamp],[],['Kategori','Jumlah (Rp)','Persen']].concat(Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,v])=>[catOf(c).n,v,total?Math.round(v/total*1000)/10+'%':'0%']));
  const dh=[[stamp],[],['Jenis','Nama','Jumlah (Rp)','Sudah dibayar (Rp)','Sisa (Rp)','Jatuh tempo','Status','Catatan']].concat(
    state.debts.map(x=>[x.dir==='out'?'Saya berhutang':'Piutang',x.name,x.amount,x.paid||0,x.amount-(x.paid||0),x.due||'',debtStatus(x).txt,x.note||'']));
  const open=state.debts.filter(x=>!x.done);
  const sisa=d=>open.filter(x=>x.dir===d).reduce((a,x)=>a+x.amount-(x.paid||0),0);
  dh.push([],['','Total sisa hutang saya','','',sisa('out')],['','Total sisa piutang','','',sisa('in')]);
  if(total) cat.push([],['Total',total,'100%']);
  const ws2=XLSX.utils.aoa_to_sheet(cat); ws2['!cols']=[{wch:20},{wch:16},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws2,'Per kategori');
  const bm={};items.forEach(x=>{const l=methodLabel(x);bm[l]=bm[l]||[0,isCredit(x)];bm[l][0]+=x.amount});
  const ms=[[stamp],[],['Metode bayar','Jenis','Jumlah (Rp)','Persen']].concat(Object.entries(bm).sort((a,b)=>b[1][0]-a[1][0]).map(([l,[v,c]])=>[l,c?'Kredit/Paylater':'Tunai/Saldo',v,total?Math.round(v/total*1000)/10+'%':'0%']));
  const ws4=XLSX.utils.aoa_to_sheet(ms);ws4['!cols']=[{wch:20},{wch:16},{wch:16},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws4,'Per metode');
  const ws3=XLSX.utils.aoa_to_sheet(dh); ws3['!cols']=[{wch:16},{wch:20},{wch:14},{wch:16},{wch:14},{wch:12},{wch:20},{wch:28}];
  XLSX.utils.book_append_sheet(wb,ws3,'Hutang');
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  saveFile('Dompet-Rapi-'+BULAN[m-1]+'-'+y+'.xlsx',new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));toast('File Excel diunduh');
}
$('exportBtn').onclick=exportXlsx;

async function backupJson(){
  const out={app:'dompet-rapi',version:1,exportedAt:new Date().toISOString(),budget:state.budget,debts:state.debts,expenses:{}};
  try{const snap=await getDocs(collection(fs,'users',uid,'dompet'));snap.forEach(d=>{if(d.id.startsWith('exp-')){const v=d.data();if(v.items&&v.items.length)out.expenses[d.id.slice(4)]=v.items}})}catch(e){}
  Object.entries(state.months).forEach(([m,v])=>{if(v.length)out.expenses[m]=v});
  const d=new Date();
  saveFile('dompet-rapi-backup-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json',new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));
  toast('Backup diunduh');
}
async function importJson(file){
  let data;try{data=JSON.parse(await file.text())}catch(e){toast('File backup tidak valid');return}
  if(!data||data.app!=='dompet-rapi'){toast('Ini bukan file backup Dompet Rapi');return}
  const nM=Object.keys(data.expenses||{}).length;
  if(!confirm('Impor '+(data.debts||[]).length+' catatan hutang dan pengeluaran '+nM+' bulan? Data yang sudah ada tidak dihapus, hanya digabung.'))return;
  const ids=new Set(state.debts.map(x=>x.id));(data.debts||[]).forEach(x=>{if(!ids.has(x.id))state.debts.push(x)});
  await saveDebts();
  if(data.budget&&!state.budget){state.budget=data.budget;await saveSettings()}
  for(const [m,items] of Object.entries(data.expenses||{})){
    await ensureMonth(m);const have=new Set(state.months[m].map(x=>x.id));
    items.forEach(x=>{if(!have.has(x.id))state.months[m].push(x)});await saveMonth(m);
  }
  render();toast('Impor selesai');
}
$('backupBtn').onclick=backupJson;

function render(){
  $('tab-debt').setAttribute('aria-selected',tab==='debt');$('tab-exp').setAttribute('aria-selected',tab==='exp');
  $('view-debt').hidden=tab!=='debt';$('view-exp').hidden=tab!=='exp';
  $('fab').textContent='+ Catat hutang';$('fab').hidden=tab==='exp'||!uid;
  renderDebts(); renderExp();
  if(tab==='exp'){ensureMonth(monthKey(new Date())).then(()=>openExpSheet(null,true))} else $('view-exp').innerHTML='';
}
$('tab-debt').onclick=()=>{tab='debt';render()};
$('tab-exp').onclick=()=>{tab='exp';render()};
$('fab').onclick=()=>openDebtSheet();

let swReg=null;
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(r=>swReg=r).catch(()=>{})}
function notifLabel(){const b=$('notifBtn');if(!('Notification' in window)){b.hidden=true;return}
  b.textContent=Notification.permission==='granted'?'🔔 Tes notifikasi':(Notification.permission==='denied'?'🔕 Notifikasi diblokir':'🔔 Aktifkan notifikasi')}
async function showNotif(title,body){
  try{const r=swReg||(navigator.serviceWorker&&await navigator.serviceWorker.getRegistration());
    if(r){await r.showNotification(title,{body,icon:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">💰</text></svg>'),tag:'dompet-due'});return true}
    new Notification(title,{body});return true}catch(e){return false}
}
function dueSummary(){
  const open=state.debts.filter(x=>!x.done&&x.due&&daysUntil(x.due)<=3);
  if(!open.length) return null;
  open.sort((a,b)=>a.due.localeCompare(b.due));
  const lines=open.slice(0,4).map(x=>{const n=daysUntil(x.due);return (n<0?'Telat '+(-n)+' hari':n===0?'Hari ini':n+' hari lagi')+': '+x.name+' '+rp(x.amount-(x.paid||0))});
  return {title:open.length+' hutang/piutang segera jatuh tempo',body:lines.join('\n')+(open.length>4?'\n+'+(open.length-4)+' lainnya':'')};
}
async function checkDueNotif(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const sum=dueSummary();if(!sum)return;
  let last='';try{last=localStorage.getItem('dompet-notif-'+uid)||''}catch(e){}
  if(last===todayStr())return;
  if(await showNotif(sum.title,sum.body)){try{localStorage.setItem('dompet-notif-'+uid,todayStr())}catch(e){}}
}
$('notifBtn').onclick=async()=>{
  if(!('Notification' in window)){toast('Browser ini tidak mendukung notifikasi');return}
  if(Notification.permission==='denied'){toast('Notifikasi diblokir. Izinkan lewat pengaturan situs di browser.');return}
  if(Notification.permission!=='granted'){const p=await Notification.requestPermission();notifLabel();if(p!=='granted'){toast('Izin notifikasi tidak diberikan');return}}
  const sum=dueSummary();
  await showNotif(sum?sum.title:'Notifikasi Dompet Rapi aktif',sum?sum.body:'Anda akan diingatkan saat ada hutang yang jatuh tempo dalam 3 hari.');
  toast('Notifikasi aktif');
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&uid)checkDueNotif()});
const closeMenu=()=>{$('moreMenu').hidden=true;$('moreBtn').setAttribute('aria-expanded','false')};
$('moreBtn').onclick=e=>{e.stopPropagation();const h=!$('moreMenu').hidden;$('moreMenu').hidden=h;$('moreBtn').setAttribute('aria-expanded',String(!h))};
document.addEventListener('click',e=>{if(!e.target.closest('.menuwrap'))closeMenu()});
$('moreMenu').addEventListener('click',()=>closeMenu());
$('budgetBtn').onclick=()=>openBudgetSheet();
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=e=>{const f=e.target.files[0];if(f)importJson(f);e.target.value=''};
$('logoutBtn').onclick=()=>{if(confirm('Keluar dari akun?'))signOut(auth)};
$('loginBtn').onclick=async()=>{
  const p=new GoogleAuthProvider();
  try{await signInWithPopup(auth,p)}catch(e){
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){signInWithRedirect(auth,p)}
    else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request'){toast('Login gagal: '+e.code)}
  }
};
onAuthStateChanged(auth,async user=>{
  if(user){
    uid=user.uid;$('login').hidden=true;$('app').hidden=false;$('fab').hidden=false;
    $('sync').textContent=user.email||'Tersinkron';
    await loadAll();render();notifLabel();checkDueNotif();
  }else{
    uid=null;state={debts:[],budget:0,months:{}};
    $('login').hidden=false;$('app').hidden=true;$('fab').hidden=true;
  }
});
</script>
